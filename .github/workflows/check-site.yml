name: Check site

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check tool JavaScript
        run: |
          node --check assets/dominions-tools.js
          node --check assets/dominions-reference.js
          node --check assets/site.js
          node --check assets/site-search.js
          node --check assets/report.js
          node --check assets/tool-data.js
          node --check assets/updates.js
          node --check assets/toolkit.js
          node --check scripts/build-dominions-reference.mjs
          node scripts/build-dominions-reference.mjs --check
          node scripts/check-toolkit.mjs

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check internal links
        run: node scripts/check-built-site.mjs _site
